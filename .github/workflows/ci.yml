name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: R motoru (HF Docker imajında testthat)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Yayınlanacak motor imajını derle
        run: docker build --progress=plain -f deploy/hf-space/Dockerfile -t olceklab-engine:test engine
      - name: testthat
        # Genel testler yerel modu bekler; çevrim içi sınır testleri kendi ortamını kurar.
        run: docker run --name engine-tests -e ONLINE_LIMITS=false olceklab-engine:test Rscript tests/testthat.R
      - name: Test raporunu kapsayıcıdan al
        if: always()
        run: docker cp engine-tests:/app/test-results engine/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testthat-results
          path: engine/test-results/
      - name: Test kapsayıcısını kaldır
        if: always()
        run: docker rm -f engine-tests

  web:
    name: Ön yüz (vitest, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dağıtım paketleme testleri
        run: node --test ../deploy/prepare-release.test.mjs

  ai-gateway:
    name: Yapay zekâ ağ geçidi (vitest, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    defaults:
      run:
        working-directory: ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ai-gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: docker compose up (üç servis) ve uçtan uca testler
    runs-on: ubuntu-latest
    needs: [engine, web, ai-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Derle ve başlat
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: Sağlık denetimleri
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/versions
          curl -fsS http://localhost:8787/health
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
      - name: Uçtan uca testler (Playwright, SPEC §11.5)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:5173 npx playwright test
      - name: Çevrim içi modda yeniden başlat
        run: |
          docker compose down
          ONLINE_LIMITS=true VITE_DEPLOY_MODE=online docker compose up --build --detach --wait --wait-timeout 900
      - name: Çevrim içi duman testi (CORS, sınırlar ve rapor akışı)
        working-directory: web
        run: E2E_BASE_URL=http://localhost:5173 ENGINE_URL=http://localhost:8000 npx playwright test --config playwright.online.config.ts
      - name: Faz 6 sahte sağlayıcıyı başlat (gerçek API yok)
        run: docker compose -f docker-compose.yml -f docker-compose.ai-test.yml up --build --detach --wait --wait-timeout 900
      - name: Faz 6 yorum, onay, Word ve günlük akışı
        working-directory: web
        run: E2E_BASE_URL=http://localhost:5173 ENGINE_URL=http://localhost:8000 npx playwright test --config playwright.ai.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: web/test-results/
      - name: Günlükler
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ai-test.yml logs
      - name: Kapat
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ai-test.yml down
